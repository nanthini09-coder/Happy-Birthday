<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="ending.css">

</head>

<body>

    <!-- Heart Shower -->
    <div id="heart-container"></div>

    <!-- Background Music -->
    <audio id="bgMusic" autoplay loop>

        <source src="Music/UYIRE.m4r" type="audio/mpeg">

    </audio>

    <!-- Content -->

    <div class="container">

        <div id="heart" class="fade">

            ❤️

        </div>

        <h1 id="title" class="fade">

            Happy Birthday,<br>

            My Lifeline❤️

        </h1>

        <p id="message" class="fade">

            I hope this little surprise
            brought a smile to your face.
            <br>

            No matter where life takes us,<br>
            I hope we continue creating<br>
            beautiful memories together.<br><br>

            Happy Birthday once again,<br>
            My Angle❤️

        </p>

        <div id="signature" class="fade">

            With all my love,<br>

            <span>Nanthini❤️</span>

        </div>

    </div>

    <script src="ending.js"></script>

</body>

</html>
